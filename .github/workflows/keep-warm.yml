name: Keep Backend Warm

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging backend to keep it warm..."
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            https://sentiment-face-app-production.up.railway.app/health || true
          echo "Ping complete"

      - name: Ping API endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://sentiment-face-app-production.up.railway.app/api || true
